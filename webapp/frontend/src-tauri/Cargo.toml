[package]
name = "music-program-scheduler"
version = "0.0.0"
description = "Scheduling Maestro desktop shell"
authors = ["Scheduling Maestro"]
edition = "2021"

[lib]
name = "music_program_scheduler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
